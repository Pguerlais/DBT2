version: 2

sources:
  - name: raw
    schema: my_dbt_db
    tables:
      - name: raw_customers
        description: "Table brute des clients chargée depuis jaffle-shop."
        columns:
          - name: id
            description: "Identifiant unique du client."
          - name: name
            description: "Nom complet du client."

      - name: raw_orders
        description: "Table brute des commandes chargée depuis jaffle-shop."
        columns:
          - name: id
            description: "Identifiant unique de la commande."
          - name: customer
            description: "Identifiant du client ayant passé la commande."
          - name: ordered_at
            description: "Date et heure de la commande."
          - name: store_id
            description: "Identifiant du magasin."
          - name: subtotal
            description: "Montant hors taxe de la commande (en centimes)."
          - name: tax_paid
            description: "Montant de la taxe payée (en centimes)."
          - name: order_total
            description: "Montant total de la commande (en centimes)."
